<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>የአንበሳው ጢስ — ትዕይንት ፩</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../img/sets/sets.js"></script>
<script src="../img/puppets/baked.js" onerror="0"></script>
<script src="../lib/paper.js"></script>
<script src="../lib/cast.js"></script>
<script src="../lib/cast2.js"></script>
<script src="../lib/lion.js"></script>
<script src="audio/am/timings.js"></script>
<script src="audio/am/mouths.js"></script>
<script src="audio/am/shots.js"></script>
<script src="../lib/shared.js"></script>
<script src="scene1.js"></script>
<script src="scene2.js"></script>
<script src="scene3.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'የአንበሳው ጢስ', minutes: 1, language: 'am' };
try { if (localStorage.getItem('captions') === null) setCaptions(true, false); } catch {}

/* one beat per scene: id names audio/am/<id>.mp3 (the joined scene clip) and its TIMINGS entry */
const BEATS = [
  ['scene1', 'ቅሬታው', (m, D) => scene1(panel(0), D), { lead: false, pre: PRE1 }],
  ['scene2', 'ሶስት ጢሶች', (m, D) => scene2(panel(0), D), { lead: false, pre: PRE2 }],
  ['scene3', 'ትምህርቱ', (m, D) => scene3(panel(0), D), { lead: false, pre: PRE3 }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// build both puppets once, off screen, so their bitmaps are ready before the first beat asks for them
paperWarm(g => { asterPuppet(g); emebetPuppet(g); });
boot();
</script>
</body>
</html>
